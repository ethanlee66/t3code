name: Fork Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel brand and updater stream (nightly installs as T3 Code (Nightly).app)"
        required: false
        type: choice
        default: nightly
        options:
          - nightly
          - stable
      version:
        description: "Release version without v prefix (e.g. 0.1.12-nightly.20261123.1). Leave blank for auto-generation (<nextPatch>-nightly.<YYYYMMDD>.<run_number> for nightly, <desktopVersion>-fork.<run_number> for stable)."
        required: false
        type: string
        default: ""
      build_mac_arm64:
        description: "Build macOS Apple Silicon (arm64) DMG & CLI"
        required: false
        type: boolean
        default: true
      build_mac_x64:
        description: "Build macOS Intel (x64) DMG"
        required: false
        type: boolean
        default: false
      build_linux_x64:
        description: "Build Linux x64 AppImage & CLI"
        required: false
        type: boolean
        default: false
      build_win_x64:
        description: "Build Windows x64 NSIS installer & CLI (also builds Linux x64 CLI for WSL runtime)"
        required: false
        type: boolean
        default: false
      launch_check:
        description: "Run packaged app smoke launch check (optional; unsigned macOS DMGs may hit Gatekeeper)"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create GitHub Release as a draft"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    name: Preflight
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
      release_channel: ${{ steps.resolve.outputs.release_channel }}
      manifest_channel: ${{ steps.resolve.outputs.manifest_channel }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      draft: ${{ steps.resolve.outputs.draft }}
      launch_check: ${{ steps.resolve.outputs.launch_check }}
      build_mac_arm64: ${{ steps.resolve.outputs.build_mac_arm64 }}
      build_mac_x64: ${{ steps.resolve.outputs.build_mac_x64 }}
      build_linux_x64: ${{ steps.resolve.outputs.build_linux_x64 }}
      build_win_x64: ${{ steps.resolve.outputs.build_win_x64 }}
      clerk_publishable_key: ${{ steps.resolve.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.resolve.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.resolve.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.resolve.outputs.relay_url }}
    steps:
      - name: Checkout metadata files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            .env.example
            apps/desktop/package.json
          sparse-checkout-cone-mode: false

      - id: resolve
        name: Resolve release inputs and public config
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_MAC_ARM64: ${{ inputs.build_mac_arm64 }}
          INPUT_BUILD_MAC_X64: ${{ inputs.build_mac_x64 }}
          INPUT_BUILD_LINUX_X64: ${{ inputs.build_linux_x64 }}
          INPUT_BUILD_WIN_X64: ${{ inputs.build_win_x64 }}
          INPUT_LAUNCH_CHECK: ${{ inputs.launch_check }}
          INPUT_DRAFT: ${{ inputs.draft }}
          VAR_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
          VAR_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
          VAR_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
          VAR_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
        run: |
          set -euo pipefail

          base_version="$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('apps/desktop/package.json', 'utf8')).version)")"
          next_patch_version="$(node -e "const v=JSON.parse(require('node:fs').readFileSync('apps/desktop/package.json','utf8')).version; const [maj,min,pat]=v.split('-')[0].split('.').map(Number); console.log(\`\${maj}.\${min}.\${pat+1}\`);")"

          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            build_mac_arm64="true"
            build_mac_x64="false"
            build_linux_x64="false"
            build_win_x64="false"
            launch_check="false"
            draft="false"
          else
            channel="${INPUT_CHANNEL:-nightly}"
            raw_input="$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')"
            raw_input="${raw_input#v}"
            if [[ -n "$raw_input" ]]; then
              if [[ "$channel" == "nightly" && ! "$raw_input" =~ -nightly\.[0-9]{8}\.[0-9]+$ ]]; then
                echo "::error::Nightly channel version must end with -nightly.<YYYYMMDD>.<N> (for example ${next_patch_version}-nightly.$(date -u +%Y%m%d).1), got '$raw_input'."
                exit 1
              fi
              version="$raw_input"
            elif [[ "$channel" == "nightly" ]]; then
              version="${next_patch_version}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
            else
              version="${base_version}-fork.${GITHUB_RUN_NUMBER}"
            fi
            tag="v${version}"
            build_mac_arm64="${INPUT_BUILD_MAC_ARM64:-true}"
            build_mac_x64="${INPUT_BUILD_MAC_X64:-false}"
            build_linux_x64="${INPUT_BUILD_LINUX_X64:-false}"
            build_win_x64="${INPUT_BUILD_WIN_X64:-false}"
            launch_check="${INPUT_LAUNCH_CHECK:-false}"
            draft="${INPUT_DRAFT:-false}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid SemVer release version: '$version'"
            exit 1
          fi

          if [[ "$version" =~ -nightly\.[0-9]{8}\.[0-9]+$ ]]; then
            release_channel="nightly"
            manifest_channel="nightly"
          else
            release_channel="stable"
            manifest_channel="latest"
          fi

          if [[ "$version" == *-* ]]; then
            prerelease="true"
          else
            prerelease="false"
          fi

          # Windows builds embed the Linux x64 CLI archive as the WSL runtime and wait
          # for the `Build Linux x64` job inside release-desktop.yml.
          if [[ "$build_win_x64" == "true" && "$build_linux_x64" != "true" ]]; then
            echo "Windows build enabled; automatically enabling build_linux_x64=true for the WSL runtime CLI."
            build_linux_x64="true"
          fi

          if [[ "$build_mac_arm64" != "true" && "$build_mac_x64" != "true" && "$build_linux_x64" != "true" && "$build_win_x64" != "true" ]]; then
            echo "::error::Select at least one target platform to build."
            exit 1
          fi

          env_example() {
            sed -n "s|^T3CODE_$1=||p" .env.example | head -n 1
          }

          clerk_publishable_key="${VAR_CLERK_PUBLISHABLE_KEY:-$(env_example CLERK_PUBLISHABLE_KEY)}"
          clerk_jwt_template="${VAR_CLERK_JWT_TEMPLATE:-$(env_example CLERK_JWT_TEMPLATE)}"
          clerk_cli_oauth_client_id="${VAR_CLERK_CLI_OAUTH_CLIENT_ID:-$(env_example CLERK_CLI_OAUTH_CLIENT_ID)}"
          raw_relay_url="${VAR_RELAY_URL:-$(env_example RELAY_URL)}"
          relay_domain="${raw_relay_url#https://}"
          relay_domain="${relay_domain#http://}"
          relay_domain="${relay_domain%/}"

          if [[ -z "$clerk_publishable_key" || -z "$clerk_jwt_template" || -z "$clerk_cli_oauth_client_id" || -z "$relay_domain" ]]; then
            echo "::error::Missing public Clerk/Relay configuration from .env.example or repository variables."
            exit 1
          fi
          relay_url="https://${relay_domain}"

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "ref=${GITHUB_SHA}"
            echo "release_channel=${release_channel}"
            echo "manifest_channel=${manifest_channel}"
            echo "prerelease=${prerelease}"
            echo "draft=${draft}"
            echo "launch_check=${launch_check}"
            echo "build_mac_arm64=${build_mac_arm64}"
            echo "build_mac_x64=${build_mac_x64}"
            echo "build_linux_x64=${build_linux_x64}"
            echo "build_win_x64=${build_win_x64}"
            echo "clerk_publishable_key=${clerk_publishable_key}"
            echo "clerk_jwt_template=${clerk_jwt_template}"
            echo "clerk_cli_oauth_client_id=${clerk_cli_oauth_client_id}"
            echo "relay_url=${relay_url}"
          } >> "$GITHUB_OUTPUT"

  build_bundle:
    name: Build JS bundle
    needs: [preflight]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.preflight.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.preflight.outputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.preflight.outputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ needs.preflight.outputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata

      - name: Upload dependency verification
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata/lockfile-verified.jsonl
          if-no-files-found: ignore
          retention-days: 1

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - id: bundle_build
        name: Check bundle-only build support
        shell: bash
        run: |
          script="$(node -p "require('./package.json').scripts['build:desktop:bundle'] ? 'build:desktop:bundle' : 'build:desktop'")"
          echo "script=$script" >> "$GITHUB_OUTPUT"

      - if: steps.bundle_build.outputs.script == 'build:desktop'
        uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        if: steps.bundle_build.outputs.script == 'build:desktop'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run ${{ steps.bundle_build.outputs.script }}

      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [preflight, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build_bundle.result == 'success' && needs.preflight.outputs.build_mac_arm64 == 'true' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      relay_client_tracing: false
      untrusted_bundle: false
      clerk_publishable_key: ${{ needs.preflight.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.preflight.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.preflight.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.preflight.outputs.relay_url }}
      label: macOS arm64
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true
      launch_check: ${{ needs.preflight.outputs.launch_check == 'true' }}
      save_pnpm_store: ${{ needs.preflight.outputs.build_mac_x64 != 'true' }}

  desktop_mac_x64:
    name: Desktop macOS x64
    needs: [preflight, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build_bundle.result == 'success' && needs.preflight.outputs.build_mac_x64 == 'true' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      relay_client_tracing: false
      untrusted_bundle: false
      clerk_publishable_key: ${{ needs.preflight.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.preflight.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.preflight.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.preflight.outputs.relay_url }}
      label: macOS x64
      runner: macos-15
      platform: mac
      target: dmg
      arch: x64
      rust_target: x86_64-apple-darwin
      resource_key: darwin-x64
      cli_archive: false
      launch_check: false
      save_pnpm_store: true

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [preflight, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build_bundle.result == 'success' && needs.preflight.outputs.build_linux_x64 == 'true' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      relay_client_tracing: false
      untrusted_bundle: false
      clerk_publishable_key: ${{ needs.preflight.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.preflight.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.preflight.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.preflight.outputs.relay_url }}
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: ${{ needs.preflight.outputs.launch_check == 'true' }}

  desktop_win_x64:
    name: Desktop Windows x64
    needs: [preflight, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build_bundle.result == 'success' && needs.preflight.outputs.build_win_x64 == 'true' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      relay_client_tracing: false
      untrusted_bundle: false
      clerk_publishable_key: ${{ needs.preflight.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.preflight.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.preflight.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.preflight.outputs.relay_url }}
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true

  publish:
    name: Publish release
    needs:
      [
        preflight,
        build_bundle,
        desktop_mac_arm64,
        desktop_mac_x64,
        desktop_linux_x64,
        desktop_win_x64,
      ]
    if: >-
      ${{
        !failure() && !cancelled() &&
        needs.preflight.result == 'success' &&
        needs.build_bundle.result == 'success' &&
        contains(fromJSON('["success","skipped"]'), needs.desktop_mac_arm64.result) &&
        contains(fromJSON('["success","skipped"]'), needs.desktop_mac_x64.result) &&
        contains(fromJSON('["success","skipped"]'), needs.desktop_linux_x64.result) &&
        contains(fromJSON('["success","skipped"]'), needs.desktop_win_x64.result) &&
        (
          needs.desktop_mac_arm64.result == 'success' ||
          needs.desktop_mac_x64.result == 'success' ||
          needs.desktop_linux_x64.result == 'success' ||
          needs.desktop_win_x64.result == 'success'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets

      - name: Download all CLI archives
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets

      - id: check_manifests
        name: Normalize single-arch manifests and write CLI checksums
        shell: bash
        env:
          MANIFEST_CHANNEL: ${{ needs.preflight.outputs.manifest_channel }}
        run: |
          set -euo pipefail
          assets_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets_dir"
          cd "$assets_dir"

          needs_mac_merge="false"
          if [[ -f "${MANIFEST_CHANNEL}-mac.yml" && -f "${MANIFEST_CHANNEL}-mac-x64.yml" ]]; then
            needs_mac_merge="true"
          elif [[ -f "${MANIFEST_CHANNEL}-mac-x64.yml" && ! -f "${MANIFEST_CHANNEL}-mac.yml" ]]; then
            mv "${MANIFEST_CHANNEL}-mac-x64.yml" "${MANIFEST_CHANNEL}-mac.yml"
          fi

          if [[ -f "${MANIFEST_CHANNEL}-win-x64.yml" && ! -f "${MANIFEST_CHANNEL}.yml" ]]; then
            mv "${MANIFEST_CHANNEL}-win-x64.yml" "${MANIFEST_CHANNEL}.yml"
          fi

          shopt -s nullglob
          archives=(t3-*.tar.gz t3-*.zip)
          if (( ${#archives[@]} > 0 )); then
            sha256sum "${archives[@]}" > SHA256SUMS
            cat SHA256SUMS
          fi

          echo "needs_mac_merge=${needs_mac_merge}" >> "$GITHUB_OUTPUT"

      - name: Checkout scripts for dual-arch manifest merge
        if: steps.check_manifests.outputs.needs_mac_merge == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Download dependency verification
        if: steps.check_manifests.outputs.needs_mac_merge == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata

      - name: Setup scripts dependencies
        if: steps.check_manifests.outputs.needs_mac_merge == 'true'
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...
          save-pnpm-store: false
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata

      - name: Merge dual-arch macOS updater manifests
        if: steps.check_manifests.outputs.needs_mac_merge == 'true'
        env:
          MANIFEST_CHANNEL: ${{ needs.preflight.outputs.manifest_channel }}
        run: |
          node scripts/merge-update-manifests.ts --platform mac \
            "$RUNNER_TEMP/release-assets/${MANIFEST_CHANNEL}-mac.yml" \
            "$RUNNER_TEMP/release-assets/${MANIFEST_CHANNEL}-mac-x64.yml"
          rm -f "$RUNNER_TEMP/release-assets/${MANIFEST_CHANNEL}-mac-x64.yml"

      - id: release_files
        name: Resolve release asset list
        shell: bash
        env:
          MANIFEST_CHANNEL: ${{ needs.preflight.outputs.manifest_channel }}
        run: |
          set -euo pipefail
          assets_dir="$RUNNER_TEMP/release-assets"
          shopt -s nullglob
          files=()
          for path in \
            "$assets_dir"/*.dmg \
            "$assets_dir"/*.zip \
            "$assets_dir"/*.AppImage \
            "$assets_dir"/*.deb \
            "$assets_dir"/*.exe \
            "$assets_dir"/*.tar.gz \
            "$assets_dir"/*.blockmap \
            "$assets_dir"/"${MANIFEST_CHANNEL}"*.yml \
            "$assets_dir"/SHA256SUMS; do
            if [[ -f "$path" && "$(basename "$path")" != "builder-debug.yml" ]]; then
              files+=("$path")
            fi
          done

          if (( ${#files[@]} == 0 )); then
            echo "::error::No release assets found in $assets_dir"
            exit 1
          fi

          {
            echo 'files<<EOF'
            printf '%s\n' "${files[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.prerelease }}
          draft: ${{ needs.preflight.outputs.draft }}
          make_latest: ${{ needs.preflight.outputs.prerelease == 'false' }}
          files: ${{ steps.release_files.outputs.files }}
          fail_on_unmatched_files: true
          token: ${{ github.token }}
